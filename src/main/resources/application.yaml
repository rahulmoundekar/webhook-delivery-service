spring:
  application:
    name: webhook-delivery-service

  datasource:
    url: jdbc:postgresql://localhost:5432/webhook_delivery
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info